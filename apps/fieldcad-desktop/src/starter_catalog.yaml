apiVersion: fieldcad.catalog/v1
kind: ObjectTemplate
metadata:
  catalog: starter
  name: electron
  description: Electron
  annotations:
    source: NIST CODATA 2022 / SRD 121
spec:
  objectKind: world-object
  components:
    - type: { plugin: fieldcad.mass-sources, name: inertial-mass }
      properties:
        mass: { scalar: { siValue: 9.1093837139e-31 } }
    - type: { plugin: fieldcad.electromagnetic-sources, name: charge-source }
      properties:
        charge: { scalar: { siValue: -1.602176634e-19 } }
---
