[package]
name = "fieldcad-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fieldcad"
path = "src/main.rs"

[dependencies]
bytemuck = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
fieldcad-core = { workspace = true }
fieldcad-dynamics = { workspace = true }
fieldcad-expressions = { workspace = true }
fieldcad-electromagnetic-sources = { workspace = true }
fieldcad-electromagnetism = { workspace = true }
fieldcad-electrostatics = { workspace = true }
fieldcad-gravity = { workspace = true }
fieldcad-catalog = { workspace = true }
fieldcad-scene-document = { workspace = true }
fieldcad-sources = { workspace = true }
fieldcad-mcp = { workspace = true }
fieldcad-plugin-api = { workspace = true }
fieldcad-server = { workspace = true }
fieldcad-simulation = { workspace = true }
fieldcad-superposition = { workspace = true }
glam = { workspace = true }
open = { workspace = true }
pollster = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Parses `scene.wgsl` in a unit test so a broken shader fails the build rather
# than the first frame on a developer's machine.
fieldcad-test-field = { workspace = true }
naga = { workspace = true }
