[package]
name = "fieldcad-bench"
version = "0.1.0"
edition = "2024"
description = "Headless compute performance harness for Field CAD scenes and solvers"

[[bin]]
name = "fieldcad-bench"
path = "src/main.rs"

[dependencies]
fieldcad-core = { workspace = true }
fieldcad-electromagnetic-sources = { workspace = true }
fieldcad-electromagnetism = { workspace = true }
fieldcad-electrostatics = { workspace = true }
fieldcad-expressions = { workspace = true }
fieldcad-gravity = { workspace = true }
fieldcad-sources = { workspace = true }
fieldcad-plugin-api = { workspace = true }
fieldcad-simulation = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
