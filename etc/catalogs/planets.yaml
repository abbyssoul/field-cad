# Reference catalog of notable Solar System bodies — one ObjectTemplate per body.
# Physical data from NASA/JPL fact sheets and mission results; masses and radii
# are mean/equatorial values as flagged per entry.
---
apiVersion: fieldcad.catalog/v1
kind: ObjectTemplate
metadata:
  catalog: solar-system
  name: sol
  description: Sol
  annotations:
    source: NASA/JPL Planetary Fact Sheet
spec:
  objectKind: world-object
  shape:
    kind: sphere
    radiusMetres: 6.9634e+8
  components:
  - type:
      plugin: fieldcad.mass-sources
      name: inertial-mass
    properties:
      mass:
        scalar:
          siValue: 1.989e+30
  - type:
      plugin: fieldcad.mass-sources
      name: gravitational-mass
    properties:
      follows-inertial:
        boolean: true
