name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The headless crates carry the domain model and every numerical guarantee.
  # They must build and pass without a window system or a GPU, on every target
  # platform, so this job deliberately does not install graphics dependencies.
  headless:
    name: Headless core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: >
          cargo test
          -p fieldcad-core
          -p fieldcad-plugin-api
          -p fieldcad-simulation
          -p fieldcad-test-field

  # Milestone 1 requires the app to build and its shader to compile on all three
  # target platforms. The WGSL is parsed and validated on the CPU by a unit test,
  # so a broken shader fails here rather than on a user's first frame.
  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux window-system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build -p fieldcad-desktop
      - name: Test
        run: cargo test -p fieldcad-desktop

  # Guards the failure modes no unit test can see: a GPU pipeline that only
  # breaks on a real device, and a teardown-order bug that only shows up when
  # the process exits. Both have bitten this project.
  graphics:
    name: Graphics smoke and clean shutdown
    runs-on: ubuntu-latest
    env:
      # Runners have no GPU; make software rendering explicit rather than
      # depending on whatever the image happens to provide.
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install window system and software renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            mesa-vulkan-drivers libgl1-mesa-dri \
            libegl1 libegl-mesa0 libgles2 \
            xvfb

      # The OpenGL smoke test runs with no display, so wgpu reaches GL through
      # EGL's surfaceless platform rather than GLX. That needs three separate
      # pieces, and a missing one reports only as "gl drivers/libraries could
      # not be loaded", so check them here where the diagnosis is cheap:
      # libEGL.so.1 is the loader wgpu dlopens (libegl1), libEGL_mesa.so.0 is
      # the driver behind it that provides EGL_MESA_platform_surfaceless
      # (libegl-mesa0), and swrast_dri.so is the llvmpipe renderer it drives
      # (libgl1-mesa-dri).
      - name: Verify the headless OpenGL stack is present
        run: |
          missing=0
          for lib in \
            /usr/lib/x86_64-linux-gnu/libEGL.so.1 \
            /usr/lib/x86_64-linux-gnu/libEGL_mesa.so.0 \
            /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so
          do
            if [ -e "$lib" ]; then
              echo "found $lib"
            else
              echo "::error::missing $lib — the OpenGL backend cannot start without it"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build
        run: cargo build --release -p fieldcad-desktop

      # No surface and no display: exercises adapter, device, shader
      # compilation, pipeline creation, and submission in isolation.
      - name: Offscreen render (default backend)
        run: ./target/release/fieldcad --smoke 30
      - name: Offscreen render (OpenGL)
        run: WGPU_BACKEND=gl ./target/release/fieldcad --smoke 30

      # Opens a real window, runs, and quits by itself. The assertion is the
      # exit code: a teardown-order regression segfaults here (139) while every
      # unit test still passes.
      - name: Windowed run exits cleanly
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            ./target/release/fieldcad --exit-after 8 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          echo "exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::windowed run exited with $status (139 indicates SIGSEGV)"
            exit "$status"
          fi
          grep -q "shut down cleanly" run.log \
            || { echo "::error::the app did not reach its clean shutdown path"; exit 1; }

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux window-system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
