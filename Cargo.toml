[workspace]
resolver = "3"
members = [
    "apps/fieldcad-desktop",
    "crates/fieldcad-bench",
    "crates/fieldcad-core",
    "crates/fieldcad-dynamics",
    "crates/fieldcad-electromagnetic-sources",
    "crates/fieldcad-mass-sources",
    "crates/fieldcad-particles",
    "crates/fieldcad-plugin-api",
    "crates/fieldcad-simulation",
    "plugins/electrostatics",
    "plugins/electromagnetism",
    "plugins/test-field",
]
default-members = ["apps/fieldcad-desktop"]

# Shared versions live here so a bump happens once. Notably `glam`, `serde`, and
# `thiserror` appear in most crates; `wgpu`, `winit`, and the `egui` family must
# stay mutually compatible and are pinned together.
#
# `wgpu` is the version `egui-wgpu` depends on, and cannot lead it. The app hands
# egui the same device, queue, and render pass it uses itself, so two `wgpu`
# versions in the tree are not merely wasteful — they are different types, and
# every one of those calls stops compiling. Bump `wgpu` only together with the
# `egui` family, and check what `egui-wgpu` requires first.
#
# `naga` follows `wgpu` for the same reason: it is a dev-dependency that
# validates the WGSL in tests, and it is only evidence about what `wgpu` will
# accept at runtime if it is the version `wgpu` itself parses with.
[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
glam = "0.33"
naga = { version = "29", features = ["wgsl-in"] }
pollster = "1.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "29"
winit = "0.30.13"

fieldcad-bench = { path = "crates/fieldcad-bench" }
fieldcad-core = { path = "crates/fieldcad-core" }
fieldcad-dynamics = { path = "crates/fieldcad-dynamics" }
fieldcad-electromagnetic-sources = { path = "crates/fieldcad-electromagnetic-sources" }
fieldcad-mass-sources = { path = "crates/fieldcad-mass-sources" }
fieldcad-particles = { path = "crates/fieldcad-particles" }
fieldcad-plugin-api = { path = "crates/fieldcad-plugin-api" }
fieldcad-simulation = { path = "crates/fieldcad-simulation" }
fieldcad-electrostatics = { path = "plugins/electrostatics" }
fieldcad-electromagnetism = { path = "plugins/electromagnetism" }
fieldcad-test-field = { path = "plugins/test-field" }
